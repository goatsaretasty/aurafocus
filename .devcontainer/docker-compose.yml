version: "3.8"

services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:20
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    environment:
      DATABASE_URL: postgres://earworm:earworm@db:5432/earworm
    depends_on:
      - db

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: earworm
      POSTGRES_PASSWORD: earworm
      POSTGRES_DB: earworm
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
